# Airflow 3 tutorial stack - deliberately smaller than the official
# docker-compose.yaml (https://airflow.apache.org/docs/apache-airflow/3.3.1/docker-compose.yaml),
# which uses CeleryExecutor + Redis + FAB auth. Here we use LocalExecutor and the
# Simple auth manager so there are fewer moving parts while learning.
#
#   postgres               metadata database
#   airflow-init           one-shot `airflow db migrate`
#   airflow-apiserver      REST API + React UI + Task Execution API
#   airflow-scheduler      scheduling + LocalExecutor task slots
#   airflow-dag-processor  parses Dag files - its own mandatory process
#   airflow-triggerer      runs async triggers for deferrable tasks
#   extra-databases        one-shot: creates the `optuna` database on postgres
#   mlflow                 experiment tracking + model registry, UI on :5000
#
# Airbyte is NOT in this file: it runs in its own Kubernetes-in-Docker cluster,
# installed with `abctl` (§9), and the Airflow containers reach it on the host
# at host.docker.internal:8000.
---
x-airflow-common: &airflow-common
  build: .
  image: airflow3-tutorial:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # You write the Dags in this tutorial yourself, one file at a time, so the
    # Dag processor is told to look for new and changed files every 5 seconds.
    # The defaults (300 and 30) would make a file you just saved take up to
    # five minutes to appear in the UI.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Workers reach the Task Execution API, not the metadata DB directly.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-tutorial-jwt-secret-change-me}
    # Signs the request the api-server sends to fetch a task's log from the
    # container that ran it. Unset, every service invents its own and those
    # requests are rejected.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-tutorial-secret-key-change-me}
    # Local-only convenience: everyone who reaches the UI is an admin.
    # Port 8080 below is published on 127.0.0.1 only, so this never leaves your machine.
    # For a login form instead, see docs/troubleshooting.md.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Airflow creates no connections for you, so FileSensor's `fs_default` has to
    # be provided. Any AIRFLOW_CONN_<CONN_ID> env var defines a connection
    # without touching the DB.
    # CLI equivalent:
    #   airflow connections add fs_default --conn-type fs --conn-extra '{"path": "/"}'
    AIRFLOW_CONN_FS_DEFAULT: '{"conn_type": "fs", "extra": {"path": "/"}}'
    # Our tutorial package lives in ./src and must be importable by the
    # dag-processor (parsing) and the scheduler (LocalExecutor runs tasks there).
    PYTHONPATH: /opt/airflow/src
    PROJECT_TAGGER_DATA_DIR: /opt/airflow/data
    # --- The data stack (§9) -------------------------------------------------
    # Your GCP project and the service-account key you downloaded in §9. Every
    # Google client in the containers (BigQuery, dbt, the Airflow connection)
    # reads the same key file.
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    BQ_DATASET: mlops_course
    BQ_LOCATION: ${BQ_LOCATION:-US}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gcp-key.json
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type": "google_cloud_platform", "extra": {"key_path": "/opt/airflow/secrets/gcp-key.json", "project": "${GCP_PROJECT_ID:-}"}}'
    # Great Expectations and dbt send usage statistics unless told not to.
    GX_ANALYTICS_ENABLED: "false"
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    # --- The ML stack (§10) --------------------------------------------------
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Silences a hint MLflow prints for coding assistants on every import.
    MLFLOW_DISABLE_AGENT_HINT: "1"
    # Optuna keeps every trial of a study here, so tasks running in parallel
    # can share one study.
    OPTUNA_STORAGE: postgresql+psycopg2://airflow:airflow@postgres/optuna
  volumes:
    # `dags/` is the Dag folder Airflow parses - the one you write into.
    # `solutions/` is the finished version of every lesson, mounted read-only
    # so `pytest` can be pointed at it (DAGS_DIR=solutions); Airflow never
    # parses it.
    - ./dags:/opt/airflow/dags
    - ./solutions:/opt/airflow/solutions:ro
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./tests:/opt/airflow/tests
    - ./pytest.ini:/opt/airflow/pytest.ini
    # Read-only, and only so `pytest` can check that the tutorial's code
    # listings still match the files they quote. `docs/split*/` carries the
    # typed lesson blocks (tests/test_readme_build_steps.py) and `docs/` the
    # appendices' injected listings (tests/test_readme_listings.py) - without
    # it those tests skip themselves and prove nothing.
    - ./docs:/opt/airflow/docs:ro
    - ./scripts:/opt/airflow/scripts:ro
    # Your dbt workspace: you create the dbt project in it in §9, the way you
    # create Dag files in dags/. Read-write, because dbt also writes target/
    # and logs/ next to the project.
    - ./dbt:/opt/airflow/dbt
    # The GCP service-account key (§9). Git ignores this folder.
    - ./secrets:/opt/airflow/secrets:ro
  # host.docker.internal is how the containers reach Airbyte on the host. Docker
  # Desktop defines it already; this line defines it on Linux too.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    extra-databases:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Creates the database Optuna keeps next to Airflow's. Runs on every `up` and
  # does nothing if it already exists - an idempotent task, the property §6
  # asks of every task you write.
  extra-databases:
    image: postgres:16
    environment:
      PGPASSWORD: airflow
    command:
      - bash
      - -c
      - >-
        psql -h postgres -U airflow -tAc "SELECT 1 FROM pg_database WHERE datname = 'optuna'" | grep -q 1
        || psql -h postgres -U airflow -c "CREATE DATABASE optuna"
    depends_on:
      postgres:
        condition: service_healthy

  # Experiment tracking and the model registry (§10). Runs, metrics and
  # registered models live in a SQLite file; model files in an artifact folder
  # the server hands out, so the Airflow containers need no shared volume.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # The server rejects requests whose Host header it does not know. The
      # Airflow containers call it `mlflow`; your browser calls it `localhost`.
      - --allowed-hosts=mlflow:*,localhost:*,127.0.0.1:*
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-volume:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      retries: 5
      start_period: 15s
    restart: always

  airflow-init:
    <<: *airflow-common
    # `airflow db migrate` creates the metadata schema and brings it up to date.
    #
    # Goes through the image's own /entrypoint on purpose. When AIRFLOW_UID is
    # not 50000 (up.sh writes yours on Linux/WSL2) the entrypoint is what sets
    # HOME=/home/airflow, and Airflow is installed under that HOME's .local -
    # a bare `bash -c "airflow db migrate; echo done"` skipped it, failed with
    # "No module named 'airflow'", and still exited 0, so the other services
    # started against an unmigrated database and restarted forever.
    command: ["db", "migrate"]
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off CLI container: `docker compose run --rm airflow-cli airflow dags list`
  airflow-cli:
    <<: *airflow-common
    profiles:
      - cli
    command: version

volumes:
  postgres-db-volume:
  mlflow-volume:
